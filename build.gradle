buildscript {
    ext.kotlin_version = '2.2.20'
    ext.nav_version = '2.9.1'
    // Safe Args < 2.10 can't apply under AGP 9's new DSL
    ext.nav_safe_args_version = '2.10.2'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
        classpath 'org.jacoco:org.jacoco.core:0.8.11'
        classpath 'com.google.firebase:perf-plugin:2.0.2'
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_safe_args_version"
    }
}


allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Optional: send build output somewhere other than ./build, so a checkout on a
// network share can be built on local disk. Turned on by setting `localBuildRoot`
// (an absolute path) in that machine's ~/.gradle/gradle.properties.
//
// If localBuildRoot is on a different drive from the project (e.g. the project is
// opened by its \\server\share path), Robolectric unit tests can't run in that
// checkout; app/build.gradle disables them. To keep them, open the share through a
// directory symlink on the build drive, e.g. `mklink /D F:\src\commcare \\server\share\commcare`.
def localBuildRoot = providers.gradleProperty('localBuildRoot').orNull
if (localBuildRoot != null) {
    def buildRoot = file(localBuildRoot)
    allprojects { p ->
        def subdir = (p == rootProject) ? '_root' : p.path.substring(1).replace(':', '/')
        p.layout.buildDirectory.set(new File(buildRoot, "${rootProject.name}/${subdir}"))
    }
}

ext {
    markwon_version = '4.6.2'
    lifecycle_version = '2.5.1'
    cameraX_version = '1.4.0'
    okhttp_version = '5.5.0'
    retrofit_version = '2.9.0'
    espresso_version = '3.6.1'
    work_version = '2.10.3'
    legacy_support_version = '1.0.0'
}
