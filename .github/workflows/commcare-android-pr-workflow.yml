name: commcare-android PR CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      commcare_core_sha:
        description: 'commcare-core SHA to test against'
        required: false
      commcare_core_pr:
        description: 'commcare-core PR number for status reporting'
        required: false
      commcare_core_check_name:
        description: 'Status check name to report back to commcare-core'
        required: false
      commcare_core_status_sha:
        description: 'commcare-core PR head SHA for status reporting'
        required: false
concurrency:
  group: ${{ github.workflow }}-${{ inputs.commcare_core_sha || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-test-assemble:
    name: Build
    # Pinned until dimagi/mobile-deploy's cross-request script supports Python 3.10+;
    # setup-python has no Python 3.9 build for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write  # Codecov OIDC upload
    steps:
      - name: Checkout commcare-android
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: commcare-android
          persist-credentials: false
      - name: Install python
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.9'
      - name: Download cross request script
        if: ${{ github.event_name == 'pull_request' }}
        env:
          # Pinned so a change to mobile-deploy can't silently run inside this build
          MOBILE_DEPLOY_SHA: 87fb26f7e5585d0e321117f7815132f47d624295
        run: |
          curl -fsSL "https://raw.githubusercontent.com/dimagi/mobile-deploy/$MOBILE_DEPLOY_SHA/requirements.txt" -o requirements.txt
          curl -fsSL "https://raw.githubusercontent.com/dimagi/mobile-deploy/$MOBILE_DEPLOY_SHA/checkout_cross_request_repo.py" -o checkout_cross_request_repo.py
      - name: Install Python dependencies
        if: ${{ github.event_name == 'pull_request' }}
        run: python -m pip install -r requirements.txt
      - name: Run cross request script
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.number }}
          # Read-only token; unauthenticated calls hit the shared runner IP's rate limit
          GITHUB_TOKEN: ${{ github.token }}
        run: python checkout_cross_request_repo.py commcare-android "$PR_NUMBER" commcare-core . "$GITHUB_TOKEN"
      - name: Checkout commcare-core for cross-repo CI
        if: ${{ inputs.commcare_core_sha }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: dimagi/commcare-core
          ref: ${{ inputs.commcare_core_sha }}
          path: commcare-core
          persist-credentials: false
      - name: Generate GitHub App token
        if: ${{ always() && inputs.commcare_core_check_name && inputs.commcare_core_sha }}
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.CROSS_REPO_CI_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_CI_PRIVATE_KEY }}
          owner: dimagi
          repositories: commcare-core
      - name: Generate Gradle properties
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          TEST_BUILD_TYPE=release
          ALLOW_DEBUG_SIGNED_RELEASE=${{ github.event.pull_request.head.repo.fork == true }}
          RELEASE_STORE_FILE=/home/runner/.gradle/commcare-ci.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.CI_KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.CI_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.CI_KEY_PASSWORD }}
          GOOGLE_CLOUD_PROJECT_NUMBER=${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
          GOOGLE_SERVICES_API_KEY=${{ secrets.GOOGLE_SERVICES_API_KEY }}
          FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}
          GOOGLE_PLAY_MAPS_API_KEY=${{ secrets.GOOGLE_PLAY_MAPS_API_KEY }}
          HQ_API_USERNAME=${{ secrets.HQ_API_USERNAME }}
          HQ_API_PASSWORD=${{ secrets.HQ_API_PASSWORD }}
          MAPBOX_SDK_API_KEY=${{ secrets.MAPBOX_SDK_API_KEY }}
          EOF
      - name: Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Run Tests
        run: ./gradlew testCommcareDebug
        working-directory: commcare-android
      - name: Upload unit test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-test-report
          path: commcare-android/app/build/reports/tests/testCommcareDebugUnitTest
          if-no-files-found: warn
          retention-days: 14
      - name: Generate JaCoCo Report
        continue-on-error: true
        run: ./gradlew jacocoTestReport
        working-directory: commcare-android
      - name: Upload JaCoCo Report
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jacoco-report
          path: commcare-android/app/build/reports/jacoco
      - name: Upload coverage to Codecov
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: commcare-android/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          use_oidc: true
          fail_ci_if_error: false
      # PR builds are signed with a CI-only key, never the production signing key.
      # Artifacts from this workflow are therefore not upgrade-compatible with Play/HQ builds.
      - name: Restore CI Keystore
        run: |
          if [ -n "$CI_SIGNING_KEY" ]; then
            echo "$CI_SIGNING_KEY" | base64 -d > ~/.gradle/commcare-ci.keystore
          fi
        env:
          CI_SIGNING_KEY: ${{ secrets.CI_SIGNING_KEY }}
      - name: Assemble Release apk
        run: ./gradlew assembleCommcareRelease
        working-directory: commcare-android
      - name: Upload CommCare apk
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: commcare-release-apk
          path: commcare-android/app/build/outputs/apk/commcare/release/app-commcare-release.apk
      - name: Bundle Release aab
        run: ./gradlew bundleCommcareRelease
        working-directory: commcare-android
      - name: Upload CommCare aab
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: commcare-release-aab
          path: commcare-android/app/build/outputs/bundle/commcareRelease/app-commcare-release.aab
      - name: Assemble CCC Staging apk
        run: ./gradlew assembleCccStagingRelease
        working-directory: commcare-android
      - name: Upload CCC Staging apk
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ccc-staging-release-apk
          path: commcare-android/app/build/outputs/apk/cccStaging/release/app-cccStaging-release.apk
      - name: Assemble CommCare qaAutomation apk
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew assembleCommcareQaAutomation
        working-directory: commcare-android
      - name: Upload CommCare qaAutomation apk
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: commcare-qaAutomation-release-apk
          path: commcare-android/app/build/outputs/apk/commcare/qaAutomation/app-commcare-qaAutomation.apk
          retention-days: 3
      - name: Assemble CCC Staging qaAutomation apk
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew assembleCccStagingQaAutomation
        working-directory: commcare-android
      - name: Upload CCC Staging qaAutomation apk
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ccc-staging-qaAutomation-release-apk
          path: commcare-android/app/build/outputs/apk/cccStaging/qaAutomation/app-cccStaging-qaAutomation.apk
          retention-days: 3
      - name: Assemble CommCare apk for Instrumentation Testing
        run: ./gradlew assembleCommcareReleaseAndroidTest
        working-directory: commcare-android
      - name: Encrypt CommCare androidTest apk
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in commcare-android/app/build/outputs/apk/androidTest/commcare/release/app-commcare-release-androidTest.apk \
            -out commcare-android/app/build/outputs/apk/androidTest/commcare/release/app-commcare-release-androidTest.apk.enc \
            -pass pass:"$HQ_API_PASSWORD"
        env:
          HQ_API_PASSWORD: ${{ secrets.HQ_API_PASSWORD }}
      - name: Upload CommCare apk for Instrumentation Testing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: commcare-release-androidTest-apk
          path: commcare-android/app/build/outputs/apk/androidTest/commcare/release/app-commcare-release-androidTest.apk.enc
      - name: Report status to commcare-core
        if: ${{ always() && inputs.commcare_core_check_name && inputs.commcare_core_sha }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          COMMCARE_CORE_STATUS_SHA: ${{ inputs.commcare_core_status_sha || inputs.commcare_core_sha }}
          COMMCARE_CORE_CHECK_NAME: ${{ inputs.commcare_core_check_name }}
          JOB_STATUS: ${{ job.status }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            const description = state === 'success' ? 'Tests passed' : 'Tests failed';
            await github.rest.repos.createCommitStatus({
              owner: 'dimagi',
              repo: 'commcare-core',
              sha: process.env.COMMCARE_CORE_STATUS_SHA,
              state,
              context: process.env.COMMCARE_CORE_CHECK_NAME,
              description,
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });

  browserstack-tests:
    if: ${{ github.event_name == 'pull_request' }}
    needs: build-test-assemble
    name: BrowserStack Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commcare-android
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: commcare-android
          persist-credentials: false
      - name: Install python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'
      - name: Download release APK
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: commcare-release-apk
          path: commcare-release-apk
      - name: Download androidTest APK
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: commcare-release-androidTest-apk
          path: commcare-release-androidTest-apk
      - name: Decrypt CommCare androidTest apk
        run: |
          openssl enc -aes-256-cbc -d -pbkdf2 \
            -in commcare-release-androidTest-apk/app-commcare-release-androidTest.apk.enc \
            -out commcare-release-androidTest-apk/app-commcare-release-androidTest.apk \
            -pass pass:"$HQ_API_PASSWORD"
        env:
          HQ_API_PASSWORD: ${{ secrets.HQ_API_PASSWORD }}
      - name: Run BrowserStack Instrumentation Tests
        run: python commcare-android/scripts/browserstack.py
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_PASSWORD: ${{ secrets.BROWSERSTACK_PASSWORD }}
          RELEASE_APP_LOCATION: commcare-release-apk/app-commcare-release.apk
          TEST_APP_LOCATION: commcare-release-androidTest-apk/app-commcare-release-androidTest.apk
          BROWSERSTACK_DEVICES: "Samsung Galaxy S20-10.0"
          PR_NUMBER: ${{ github.event.number }}
