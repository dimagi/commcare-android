name: commcare-android fork PR BrowserStack tests

on:
  workflow_run:
    workflows: ["commcare-android PR CI"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browserstack-tests:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    name: BrowserStack Tests
    runs-on: ubuntu-latest
    environment: browserstack-fork-tests
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout commcare-android default branch
        uses: actions/checkout@v6
        with:
          path: commcare-android
          persist-credentials: false
      - name: Download release APK
        uses: actions/download-artifact@v6
        with:
          name: commcare-release-apk
          path: commcare-release-apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download androidTest APK
        uses: actions/download-artifact@v6
        with:
          name: commcare-release-androidTest-apk
          path: commcare-release-androidTest-apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read PR number
        id: find-pr
        run: |
          pr_number=$(head -n 1 commcare-release-androidTest-apk/pr_number)
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number in artifact"
            exit 1
          fi
          pr_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq '.head.repo.full_name + " " + .head.sha')
          if [ "$pr_head" != "$RUN_HEAD_REPOSITORY $RUN_HEAD_SHA" ]; then
            echo "PR #$pr_number does not match the triggering run's head repository and SHA"
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Install python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run BrowserStack Instrumentation Tests
        run: python commcare-android/scripts/browserstack.py
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_PASSWORD: ${{ secrets.BROWSERSTACK_PASSWORD }}
          HQ_API_USERNAME: ${{ secrets.HQ_API_USERNAME }}
          HQ_API_PASSWORD: ${{ secrets.HQ_API_PASSWORD }}
          RELEASE_APP_LOCATION: commcare-release-apk/app-commcare-release.apk
          TEST_APP_LOCATION: commcare-release-androidTest-apk/app-commcare-release-androidTest.apk
          BROWSERSTACK_DEVICES: "Samsung Galaxy S20-10.0"
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
      - name: Report status to PR
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state,
              context: 'BrowserStack Tests (fork)',
              description: state === 'success' ? 'Tests passed' : 'Tests failed',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });
