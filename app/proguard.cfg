#Retrofit Stuff
-keep class retrofit2.Call { *; }
-keepattributes Exceptions
-dontwarn okio.**

# R8 full mode strips generic signature type arguments that reference classes which
# aren't kept. Retrofit reads Continuation<Response<T>> off suspend service methods
# via reflection, so both types must be kept. Retrofit 2.9.0 ships without these
# rules; they can be dropped once we upgrade to 2.10.0+.
-keep,allowobfuscation,allowshrinking class kotlin.coroutines.Continuation

-keepattributes SourceFile,LineNumberTable
-keep public class * extends java.lang.Exception
-keep class com.google.firebase.crashlytics.** { *; }

-dontwarn com.google.android.gms.**
-keep class androidx.work.impl.** { *; }
-keep class androidx.tracing.** { *; }

#More rules so that instrumentation tests don't throw NoSuchMethodExceptions
-keepclassmembers class androidx.localbroadcastmanager.content.LocalBroadcastManager {
    public void sendBroadcastSync(android.content.Intent);
}
-keep class kotlin.collections.ArraysKt { *; }
-keep class kotlin.collections.CollectionsKt { *; }
-keep class kotlin.collections.AbstractIterator { *; }
-keep class kotlin.text.StringsKt { *; }

# Prevent stripping of Lazy initialization, used in AndroidX Test
-keep class kotlin.LazyKt { *; }

# Guava Config Start
-dontwarn javax.lang.model.element.Modifier

# Note: We intentionally don't add the flags we'd need to make Enums work.
# That's because the Proguard configuration required to make it work on
# optimized code would preclude lots of optimization, like converting enums
# into ints.

# FinalizableReferenceQueue calls this reflectively
# Proguard is intelligent enough to spot the use of reflection onto this, so we
# only need to keep the names, and allow it to be stripped out if
# FinalizableReferenceQueue is unused.
-keepnames class com.google.common.base.internal.Finalizer {
  *** startFinalizer(...);
}
# However, it cannot "spot" that this method needs to be kept IF the class is.
-keepclassmembers class com.google.common.base.internal.Finalizer {
  *** startFinalizer(...);
}
-keepnames class com.google.common.base.FinalizableReference {
  void finalizeReferent();
}
-keepclassmembers class com.google.common.base.FinalizableReference {
  void finalizeReferent();
}

# Striped64 appears to make some assumptions about object layout that
# really might not be safe. This should be investigated.
-keepclassmembers class com.google.common.cache.Striped64 {
  *** base;
  *** busy;
}
-keepclassmembers class com.google.common.cache.Striped64$Cell {
  <fields>;
}

-dontwarn java.lang.SafeVarargs

# Futures.getChecked, in both of its variants, is incompatible with proguard.

# Used by AtomicReferenceFieldUpdater and sun.misc.Unsafe
-keepclassmembers class com.google.common.util.concurrent.AbstractFuture** {
  *** waiters;
  *** value;
  *** listeners;
  *** thread;
  *** next;
}
-keepclassmembers class com.google.common.util.concurrent.AtomicDouble {
  *** value;
}
-keepclassmembers class com.google.common.util.concurrent.AggregateFutureState {
  *** remaining;
  *** seenExceptions;
}

# Since Unsafe is using the field offsets of these inner classes, we don't want
# to have class merging or similar tricks applied to these classes and their
# fields. It's safe to allow obfuscation, since the by-name references are
# already preserved in the -keep statement above.
-keep,allowshrinking,allowobfuscation class com.google.common.util.concurrent.AbstractFuture** {
  <fields>;
}

# Futures.getChecked (which often won't work with Proguard anyway) uses this. It
# has a fallback, but again, don't use Futures.getChecked on Android regardless.
-dontwarn java.lang.ClassValue

# Multimaps come as null from bundle.getExtra without this
-keep class com.google.common.collect.** { *; }

# androidx.test.ext.truth.content.IntentSubject.hasAction fails in it-tests without this
-keep class com.google.common.base.Preconditions { *; }

# keep all related to gson TypeToken
-keep class com.google.gson.reflect.TypeToken { *; }
-keep class * extends com.google.gson.reflect.TypeToken { *; }
-keep class * implements java.lang.reflect.Type

